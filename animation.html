<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelNote — Private message</title>
<link rel="stylesheet" href="animation.css">
</head>
<body class="fx-fire">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header id="bar">
    <div id="brand"><i></i>PIXELNOTE <span>· private message</span></div>
    <div class="actions">
      <button id="soundHint" type="button" hidden>🔊 Click to enable sound</button>
      <button id="vanishNow" type="button" hidden>Vanish now</button>
      <button id="close" type="button">Close <kbd>Esc</kbd></button>
    </div>
  </header>

  <main id="hud" hidden>
    <div id="timer" aria-hidden="true">
      <svg viewBox="0 0 44 44" width="44" height="44"><circle class="track" cx="22" cy="22" r="19"/><circle id="ring" cx="22" cy="22" r="19"/></svg>
      <div><b id="count"></b><small id="caption"></small></div>
    </div>
  </main>

  <p id="sr-message" class="sr" aria-live="polite"></p>

  <section id="done" hidden role="status">
    <div class="card">
      <div class="tick"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 14-17"/></svg></div>
      <h2>Message vanished</h2>
      <p id="doneText">The text was cleared from this page. Nothing was saved or logged.</p>
      <div class="row"><button id="again" type="button" hidden>Play again</button><button id="close2" type="button" class="primary">Close</button></div>
    </div>
  </section>

  <section id="gallery" hidden>
    <div class="card wide">
      <h2>Preview vanish effects</h2>
      <p>Pick an effect to see it fill the whole screen. This only uses a sample message.</p>
      <div id="chips"></div>
      <div class="opts">
        <label>Animation length
          <select id="gDur"><option value="1">1 second</option><option value="2">2 seconds</option><option value="3">3 seconds</option><option value="5" selected>5 seconds</option><option value="10">10 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select>
        </label>
        <label>Intensity
          <select id="gInt"><option value="0.55">Low</option><option value="1" selected>Normal</option><option value="1.35">High</option></select>
        </label>
        <label class="chk"><input id="gSound" type="checkbox"> Sound</label>
      </div>
    </div>
  </section>

  <script src="fx-core.js"></script>
  <script src="fx-fire.js"></script>
  <script src="fx-nature.js"></script>
  <script src="fx-sound.js"></script>
  <script src="animation.js"></script>
</body>
</html>
